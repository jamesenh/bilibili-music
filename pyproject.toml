[project]
name = "bilibili-music"
version = "0.1.0"
description = "聚合哔哩哔哩音乐视频的桌面音乐客户端(基于 PySide6)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyside6==6.8.3",
]

[project.scripts]
bilimusic = "bilibili_music.ui.main_window:run"

[project.urls]
Homepage = "https://github.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilibili_music"]

[tool.uv]
package = true
